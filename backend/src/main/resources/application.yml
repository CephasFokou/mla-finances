spring:
  application:
    name: mla-finance-backend
  profiles:
    default: dev
  config:
    # Variables locales : backend/.env (ignoré par git, modèle dans backend/.env.example) est lu
    # comme un fichier .properties — chaque ligne CLE=valeur devient une propriété que les
    # ${CLE:...} ci-dessous résolvent. Les vraies variables d'environnement gardent la priorité
    # (Railway en prod). Aucune dépendance (pas de dotenv), et "optional:" évite toute erreur si
    # le fichier n'existe pas (CI, prod). spring.profiles.active ne peut PAS y être défini
    # (interdit par Spring dans un fichier importé) : passer les profils en ligne de commande, ou
    # via scripts/dev-backend.sh qui le fait pour vous.
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# RG-18 : durée de vie du JWT — commune à tous les profils (le secret de signature, lui, diffère
# par profil, voir plus bas). 480 minutes = 8h, une journée de travail ; pas de refresh token pour
# cette première version (voir claude/module-authentification-spec.md).
app:
  jwt:
    expiration-minutes: 480
  payment:
    pawapay:
      # Intégration PawaPay (Orange Money / MTN MoMo). Désactivée par défaut : tous les dons
      # restent alors en mode « manuel » (confirmation par le secrétariat). Voir
      # payment/pawapay/* et claude/module-paiement-pawapay-spec.md.
      enabled: ${PAWAPAY_ENABLED:false}
      # Sandbox par défaut : https://api.sandbox.pawapay.io ; production : https://api.pawapay.io
      # (les jetons diffèrent entre les deux — ne jamais pointer la prod avec un jeton sandbox).
      base-url: ${PAWAPAY_BASE_URL:https://api.sandbox.pawapay.io}
      api-token: ${PAWAPAY_API_TOKEN:}
      # Segment secret de l'URL de callback (/api/v1/webhooks/pawapay/{secret}) : un callback
      # dont le secret ne correspond pas est ignoré (404). Le contenu du callback n'est de toute
      # façon jamais cru sur parole : le statut est toujours re-lu auprès de PawaPay.
      callback-secret: ${PAWAPAY_CALLBACK_SECRET:}
      currency: XAF
      country: CMR
      # Correspondance canal MLA (code payment_channels) -> code opérateur PawaPay. Un canal
      # absent de cette liste reste en mode manuel (carte, espèces, virement).
      providers:
        "[ORANGE_MONEY]": ORANGE_CMR
        "[MTN_MOMO]": MTN_MOMO_CMR
      # Bornes d'un don en ligne (FCFA, entiers : le XAF n'a pas de décimales chez PawaPay).
      min-amount: ${PAWAPAY_MIN_AMOUNT:100}
      max-amount: ${PAWAPAY_MAX_AMOUNT:500000}
      # Anti-abus : nombre maximal de demandes de paiement envoyées au même numéro sur 10 minutes
      # (un attaquant ne doit pas pouvoir inonder un téléphone de demandes de validation).
      max-initiations-per-phone: 3
      # Réconciliation : fréquence du job qui relit les statuts non finaux, et délai au-delà
      # duquel on cesse d'interroger automatiquement (le don passe alors « à vérifier » dans le
      # back-office — jamais marqué échoué d'office tant que PawaPay ne l'a pas dit).
      poll-interval-ms: 15000
      pending-timeout-minutes: 30
      connect-timeout-ms: 5000
      read-timeout-ms: 15000
    # Frais Mobile Money (PawaPay) enregistrés automatiquement à partir du grand livre wallet-ledger
    # (lignes FEE de GET /api/v1/movements), une fois par jour après l'import des relevés PawaPay de
    # wallet-ledger (05:30 UTC) et son contrôle de cohérence (06:00 UTC). Voir MobileMoneyFeeSyncService.
    fees:
      sync-enabled: ${MLA_FEES_SYNC_ENABLED:${app.payment.pawapay.enabled:false}}
      sync-cron: ${MLA_FEES_SYNC_CRON:0 0 7 * * *}
      # Fenêtre relue à chaque passage (jours) : un relevé importé en retard est rattrapé ; les frais déjà
      # comptés sont ignorés (idempotence par identifiant de mouvement). Premier passage : tout l'historique.
      lookback-days: 31
      # Début du contrôle d'écart quand wallet-ledger ne renvoie pas de date d'ouverture (RFC 3339, ex.
      # 2026-11-18T09:00:00Z = bascule de MLA sur wallet-ledger). Vide : date d'ouverture de wallet-ledger.
      ledger-start: ${MLA_LEDGER_START:}
    # Décaissement des retraits par Mobile Money (POST /v2/payouts sur wallet-ledger) : liste
    # FERMÉE des numéros MLA proposés dans le back-office, jamais de saisie libre. Miroir de la liste
    # blanche du projet MLA dans wallet-ledger, qui reste l'autorité (numéro absent là-bas =>
    # RECIPIENT_NOT_ALLOWED). msisdn : 237 + 9 chiffres ; provider : ORANGE_CMR ou MTN_MOMO_CMR.
    payout-recipients:
      - label: Orange Money MLA
        msisdn: "237697272882"
        provider: ORANGE_CMR
      - label: MTN MoMo MLA
        msisdn: "237651059561"
        provider: MTN_MOMO_CMR
  reminders:
    # Module Relances (voir reminder/ReminderService). Lien « Contribuer maintenant » des relances : le site
    # public de don (PUBLIC_SITE_URL, sinon l'origine CORS du site public, sinon le domaine de prod).
    public-site-url: ${PUBLIC_SITE_URL:${PUBLIC_FRONTEND_ORIGIN:https://don-mla.itc-services.xyz}}
    # Fréquence du job qui envoie les relances mises en file hors plage horaire (8 h - 20 h, Africa/Douala).
    queue-poll-ms: ${REMINDER_QUEUE_POLL_MS:60000}
  kapso:
    # WhatsApp des relances via Kapso (voir reminder/whatsapp). Désactivé tant que KAPSO_ENABLED n'est pas vrai :
    # les relances partent alors par email seulement. Numéro partagé avec le suivi des tâches MLA (« ICC-ChatBot »).
    enabled: ${KAPSO_ENABLED:false}
    base-url: ${KAPSO_BASE_URL:https://api.kapso.ai}
    api-key: ${KAPSO_API_KEY:}
    phone-number-id: ${KAPSO_PHONE_NUMBER_ID:}
    # Secret de signature du webhook (POST /api/v1/webhooks/kapso), donné par Kapso à la création du webhook.
    webhook-secret: ${KAPSO_WEBHOOK_SECRET:}
    language: fr
    # Modèles approuvés par Meta le 22/11/2026.
    template-monthly: mla_finance_relance_contribution
    template-project: mla_finance_relance_collecte
    template-promise: mla_finance_rappel_promesse
  rate-limit:
    # Limitation de débit par adresse IP sur les surfaces non authentifiées (voir
    # security/RateLimitFilter). Fenêtre glissante d'une minute, 429 + Retry-After au-delà.
    enabled: true
    # Faire confiance à X-Forwarded-For (première IP) uniquement derrière un proxy maîtrisé
    # (Railway, Netlify) : en local la valeur est l'adresse TCP réelle.
    trust-proxy: ${RATE_LIMIT_TRUST_PROXY:false}
    public-requests-per-minute: ${RATE_LIMIT_PUBLIC_PER_MINUTE:60}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    webhook-requests-per-minute: ${RATE_LIMIT_WEBHOOK_PER_MINUTE:120}

# Niveaux de log paramétrables sans recompiler : exporter LOG_LEVEL_APP/LOG_LEVEL_SECURITY/
# LOG_LEVEL_CORS avant de lancer le backend (n'importe quel profil, y compris prod pour du
# diagnostic ponctuel). Le profil dev descend ses propres valeurs par défaut à DEBUG plus bas — ce
# bloc ne fixe que ce qui s'applique si rien d'autre ne le redéfinit.
logging:
  level:
    org.mla.finance: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.springframework.web.cors: ${LOG_LEVEL_CORS:WARN}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:mla_finance;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  media:
    storage-dir: ./data/media-storage
  jwt:
    # JWT_SECRET (backend/.env) si défini, sinon un secret de développement fixe et versionné,
    # jamais utilisé en prod (bloc prod ci-dessous : JWT_SECRET obligatoire). >= 32 caractères
    # pour HS256.
    secret: ${JWT_SECRET:dev-only-insecure-secret-key-do-not-use-in-prod-1234567890}
  email:
    # Vide par défaut (EmailService journalise un avertissement et n'envoie rien) ; renseigner
    # RESEND_API_KEY dans backend/.env pour tester l'envoi réel avec la clé Resend de Cephas.
    resend-api-key: ${RESEND_API_KEY:}
    from: "${EMAIL_FROM:MLA Finance <no-reply@mla-finance.dev>}"
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    # Mêmes variables qu'en prod (FRONTEND_ORIGIN, PUBLIC_FRONTEND_ORIGIN — voir backend/.env),
    # avec un repli sur le pattern http://localhost:* : Vite choisit un port différent dès que
    # 5173 est occupé (5174 observé en test), setAllowedOriginPatterns gère ça (voir
    # security.SecurityConfig.corsConfigurationSource).
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:*},${PUBLIC_FRONTEND_ORIGIN:}

# Par défaut en dev : logs applicatifs + sécurité + CORS en DEBUG, pour voir tout de suite un rejet
# CORS, un 401 ou un jeton invalide plutôt que de deviner. Reste surchargeable (LOG_LEVEL_APP=INFO
# par exemple) si c'est trop verbeux au quotidien.
logging:
  level:
    org.mla.finance: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}
    org.springframework.web.cors: ${LOG_LEVEL_CORS:DEBUG}

---
# Profil « local » : à combiner avec dev (--spring.profiles.active=dev,local) pour travailler sur
# une vraie base PostgreSQL sur le poste (au lieu de H2 en mémoire), avec les mêmes facilités que
# dev (compte admin, secret JWT de dev, CORS localhost). Les valeurs par défaut visent
# localhost:5432/mla_finance avec l'utilisateur système ; surchargeables par variables
# d'environnement. Voir scripts/reset-local-db.sh pour (ré)initialiser cette base.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mla_finance}}
    username: ${DATABASE_USERNAME:${PGUSER:${USER:postgres}}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD:}}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

app:
  jwt:
    secret: ${JWT_SECRET}
  email:
    # Facultative : sans clé, EmailService journalise un avertissement et n'envoie rien (utile en
    # environnement de test sans domaine Resend vérifié).
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:MLA Finance <no-reply@mla-finance.dev>}
  media:
    # Stockage disque local (app.media.storage=local, valeur par défaut) : sur Railway, monter un
    # volume persistant sur ce chemin, sinon les médias sont perdus à chaque redéploiement.
    storage: ${MEDIA_STORAGE:local}
    storage-dir: ${MEDIA_STORAGE_DIR:/app/data/media-storage}
  bootstrap:
    # Amorçage du premier SUPER_ADMIN (security.BootstrapAdminRunner) : n'agit que si la table
    # users est vide. À retirer après la première connexion.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Administrateur}
  frontend-base-url: ${FRONTEND_BASE_URL}
  cors:
    # Deux origines de prod distinctes désormais : le back-office (FRONTEND_ORIGIN) et le site
    # public de don, déployé séparément (PUBLIC_FRONTEND_ORIGIN, voir frontend-public/ et
    # claude/module-front-office-public-spec.md). PUBLIC_FRONTEND_ORIGIN est optionnelle (le split
    # par virgule dans SecurityConfig filtre déjà les entrées vides) pour ne pas casser un
    # déploiement existant tant qu'elle n'est pas renseignée.
    allowed-origins: ${FRONTEND_ORIGIN},${PUBLIC_FRONTEND_ORIGIN:}
